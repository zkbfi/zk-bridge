# SP1 guest program for the light-client proof. SOURCE ONLY: this machine has no SP1 toolchain and this directory is
# excluded from the workspace (see ../Cargo.toml). See ../README.md for how to build it on a machine with the official toolchain.
#
# There is no withdrawal guest: the vault verifies withdrawals directly (build contract, "Change: the vault verifies
# withdrawals directly").
[package]
name = "light-client-guest"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace root, so cargo does not look for the light-client workspace above this directory.
[workspace]

[dependencies]
lc-core = { path = "../../crates/lc-core" }
sp1-zkvm = "=6.8.0" # 2026-09-11 (6.8.1 is 2026-09-24, younger than 28 days on 2026-10-20)

# Succinct's patched crates (precompiles). The tags follow https://docs.succinct.xyz/docs/sp1/optimizing-programs/precompiles
# ("Patched Crates", read 2026-10-20). Each patch must match the exact version in Cargo.lock:
# bls12_381 0.8.0, sha2 0.9.9, sha3 0.11.0 (the keccak backend of alloy-primitives 1.7.3).
# Check that each tag exists before the first build; the sha2 and sha3 tag names follow the documented pattern.
[patch.crates-io]
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.0.0" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.9.9-sp1-6.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
