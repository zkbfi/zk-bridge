# SP1 guest program (light-client proof). This directory is excluded from the workspace (see ../../Cargo.toml).
# Build and program keys: see ../README.md and ../../scripts/program-keys.sh.
#
# There is no withdrawal guest: the vault verifies withdrawals directly (build contract, "Change: the vault verifies
# withdrawals directly").
[package]
name = "light-client-guest"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace root, so cargo does not look for the light-client workspace above this directory.
[workspace]

# Section profiling (see lc_core::profile and prover/tests/sp1_execute.rs). The program keys come from builds without it.
[features]
section-profile = ["lc-core/section-profile"]

[dependencies]
lc-core = { path = "../../crates/lc-core" }
sp1-zkvm = "=6.8.0" # published 2026-09-11. The build works with 6.8.0, so the older release stays.

# Succinct's patched crates (precompiles). The tags follow https://docs.succinct.xyz/docs/sp1/optimizing-programs/precompiles
# ("Patched Crates", read 2026-10-20). Each patch must match the exact version in Cargo.lock:
# bls12_381 0.8.0, sha2 0.9.9 and 0.10.9, sha3 0.11.0 (the keccak backend of alloy-primitives 1.7.3).
# Both sha2 patches are needed: 0.9.9 for SSZ hashing, 0.10.9 for hash-to-curve inside the zkVM (see ../README.md).
[patch.crates-io]
bls12_381 = { git = "https://github.com/sp1-patches/bls12_381", tag = "patch-0.8.0-sp1-6.0.0" }
sha2-v0-9-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.9.9-sp1-6.0.0" }
sha2-v0-10-9 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
