[package]
name = "lc-core"
description = "Light-client and withdrawal verification for the hardened bridge. The function bodies of the SP1 guest programs."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# JSON parsers for node answers (`lc_core::json`). The light-client guests do not enable it.
json = ["dep:serde_json"]
# Section profiling for the guests (`lc_core::profile`): `tracked` runs one named section twice. The shipped guests leave it off.
section-profile = []

[dependencies]
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
bls12_381.workspace = true
sha2.workspace = true
serde_json = { workspace = true, optional = true }

# The SP1 patch of bls12_381 0.8.0 builds on `digest` 0.10, while the crates.io release builds on `digest` 0.9.
# Hash-to-curve therefore needs sha2 0.10.9 inside the zkVM only. Native builds keep sha2 0.9.9.
[target.'cfg(target_os = "zkvm")'.dependencies]
sha2-digest10 = { package = "sha2", version = "=0.10.9", default-features = false }
