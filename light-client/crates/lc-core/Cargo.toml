[package]
name = "lc-core"
description = "Light-client and withdrawal verification for the hardened bridge. The function bodies of the SP1 guest programs."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# JSON parsers for node answers (`lc_core::json`). The light-client guests do not enable it.
json = ["dep:serde_json"]

[dependencies]
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
bls12_381.workspace = true
sha2.workspace = true
serde_json = { workspace = true, optional = true }
