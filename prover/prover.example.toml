# Example configuration for zk-bridge-prover. Copy it, edit it, and pass it with --config.
# The file never holds a secret. Where a command needs one, the file names the environment variable that holds it.
# Environment overrides for [prover] and [handoff]: ZK_BRIDGE_PROVER_<KEY PATH IN CAPITALS>,
# for example ZK_BRIDGE_PROVER_PROVER_REMOTE_URL or ZK_BRIDGE_PROVER_HANDOFF_WEBHOOK_URL.

# The proving backend. The `prove` command needs this section. The `evidence` command does not.
[prover]
backend = "remote"          # "sp1" needs a build with the cargo feature `sp1` (docs/server-prover.md); "remote" needs none (docs/gpu-prover.md)
# Optional for a route: the command reads the key from the light client and refuses a file key that differs from it.
# Needed for a run that starts from an explicit head, unless the command line gives --program-vkey.
# program_vkey = "0x..."
# backend "remote" sends proof jobs to a GPU worker (docs/gpu-prover.md). The API key is read from the environment variable that
# remote_api_key_env names. It never goes in this file.
remote_url = "https://REPLACE"
remote_api_key_env = "RUNPOD_API_KEY"
# remote_timeout_seconds = 900
# remote_attempts = 4
# remote_retry_delay_seconds = 10
# backend "sp1" proves on the local processor:
# sp1_elf_path = "/elf/light-client.elf"                  # the light-client guest program
# sp1_observation_elf_path = "/elf/fork-observation.elf"  # the fork observation guest program (optional)
# backend "oracle" is for local development: it signs for a development verifier. It refuses a route whose destination
# is not on the local machine.
# oracle_key_env = "ORACLE_KEY"

# Where `prove` puts its result. The default is standard output only.
[handoff]
targets = ["stdout"]        # "stdout", "webhook", or both. `prove --to <target>` replaces this list for one run.
# The webhook gets one POST of the result. The URL must use https (http only on the local machine).
# webhook_url = "https://REPLACE"
# The token is optional. Name the variable that holds it. Without it the POST carries no Authorization header.
# webhook_bearer_env = "PROOF_WEBHOOK_TOKEN"
# webhook_timeout_seconds = 30
# webhook_attempts = 3
# webhook_retry_delay_seconds = 5

# One route is one direction. The light client on the destination chain tracks the beacon chain of the source chain.
[routes.ethereum_to_pulsechain.source]
chain_id = 1
chain = "ethereum"           # "ethereum", "pulsechain", "sepolia" or "pulsechain-testnet-v4": which fork table the beacon chain uses
beacon_url = "https://REPLACE"
# The `evidence` command also needs the execution endpoint and the bridge of the source chain.
rpc_url = "https://REPLACE"
bridge = "0x0000000000000000000000000000000000000001"          # REPLACE
# More beacon APIs, asked in order only for states (/eth/v2/debug/beacon/states/<root>) when beacon_url does not serve one or
# serves one with another root. Every state is still checked against the root of its header.
# state_urls = ["https://beaconstate-sepolia.chainsafe.io"]
# A directory for the states the prover fetched and verified. A later run reads the state of its start head from here first,
# so it does not depend on a node that still serves an old state. Keeps the 16 newest states and every state younger than
# 3 days, files of mode 0600.
# state_cache_dir = "/var/lib/zk-bridge-publisher/beacon-states"

[routes.ethereum_to_pulsechain.destination]
chain_id = 369
rpc_url = "https://REPLACE"
light_client = "0x0000000000000000000000000000000000000002"   # REPLACE
# The `evidence` command also needs the bridge of the destination chain, and where to scan for stored heads.
bridge = "0x0000000000000000000000000000000000000003"          # REPLACE
start_block = 0              # the block where the light client was deployed
# log_block_range = 2000     # the largest block range of one eth_getLogs call
