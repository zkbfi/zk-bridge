# The prover service of the hardened bridge. It is its own cargo workspace, separate from light-client/.
# Every dependency is pinned with "=" to one exact version.
# The date next to each line is the crates.io publish date of that version (checked on 2026-10-20).
# The rule is: published on or before 2026-09-22 (at least 28 days before 2026-10-20).
# scripts/check-crate-ages.sh checks the same rule for every crate in Cargo.lock, including indirect ones.
[workspace]
resolver = "2"
members = ["."]

[package]
name = "zk-bridge-prover"
description = "Keeps the hardened bridge moving: watches deposits, advances the light client, submits withdrawals."
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "zk-bridge-prover"
path = "src/main.rs"

# Bots and a beacon stub for the local network in docker/. Development only: it needs the feature `dev-source`.
[[bin]]
name = "local-network"
path = "src/bin/local_network.rs"
required-features = ["dev-source"]

# Evidence builder for the red-team attacks in attacks/local/. Development only: it needs the feature `dev-source`.
[[bin]]
name = "attack-evidence"
path = "../attacks/local/src/main.rs"
required-features = ["dev-source"]

[features]
# `dev-source` builds the development beacon source (DevBeaconSource) that serves Anvil. It needs the test crate
# `lc-testkit` for its synthetic beacon data. A production build leaves it out: `cargo build --release --no-default-features`.
default = ["dev-source"]
dev-source = ["dep:lc-testkit"]
# The production proving backend. Off by default and never built on the development machine.
# See docs in src/prover.rs ("Enabling the sp1 feature").
sp1 = []

[dependencies]
# The light-client crates. Every call goes through src/light_client.rs.
# `lc-core` holds the builders for withdrawals, receipts, beacon states, ancestry and gate evidence.
lc-core = { path = "../light-client/crates/lc-core", features = ["json"] }
# Synthetic beacon data for the development source only (feature `dev-source`). The tests always use it.
lc-testkit = { path = "../light-client/crates/lc-testkit", optional = true }

alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std"] } # 2026-09-10
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] } # 2026-09-10
alloy-rlp = { version = "=0.3.16", default-features = false, features = ["std"] } # 2026-07-03
serde = { version = "=1.0.229", features = ["derive"] } # 2026-07-18
serde_json = { version = "=1.0.151" } # 2026-07-20
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "gzip"] } # 2026-09-13
rusqlite = { version = "=0.40.2", features = ["bundled"] } # 2026-08-08
toml = { version = "=0.9.8", default-features = false, features = ["parse", "serde"] } # 2025-10-09
clap = { version = "=4.6.7", features = ["derive"] } # 2026-09-14
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] } # 2024-09-20
scrypt = { version = "=0.11.0", default-features = false, features = ["std"] } # 2023-03-05
aes = { version = "=0.8.4" } # 2024-02-13
ctr = { version = "=0.9.2" } # 2022-09-30

[dev-dependencies]
lc-testkit = { path = "../light-client/crates/lc-testkit" }

# BLS12-381 arithmetic in lc-core is slow without optimization, as in the light-client workspace.
[profile.dev]
opt-level = 2
