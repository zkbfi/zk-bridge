packages:
  - core
  - data
  - react
  - shared
  - indexer
  - terminal
  - bots
  - web
  - e2e
  - backend
  - status
  - docs
  - release
# Refuse any package version younger than 28 days (40320 minutes), direct or transitive.
minimumReleaseAge: 40320
# Run no install scripts except the two native USB modules the hardware wallets need.
# The esbuild binary comes from its platform package; keccak falls back to its JavaScript build.
allowBuilds:
  esbuild: false
  keccak: false
  node-hid: true
  usb: true
