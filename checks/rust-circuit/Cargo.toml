[package]
name = "spec-circuit-check"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

# Dependencies implied by the imports in the specification's main.rs.
# Versions are the newest ones the installed rustc (1.93) can build.
# Cargo's Minimum Supported Rust Version aware resolver picks them.
[dependencies]
alloy = { version = "2", default-features = false, features = ["provider-http", "rpc-types", "reqwest"] }
eyre = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
