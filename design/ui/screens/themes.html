<style>
  .th { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .pg { background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; border: 1px solid #d8d4ce; }
  .band { position: relative; background: var(--band, var(--bg)); border-bottom: var(--rule); }
  .from { background: var(--from); } .to { background: var(--to); }
  .in { padding: 12px 14px; }
  .top { display: flex; align-items: center; gap: 8px; }
  .chip { border: var(--chipb); border-radius: 999px; padding: 3px 11px; font-weight: 600; font-size: 11px; background: var(--chipbg); color: var(--ink); white-space: nowrap; }
  .menu { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 11px; font-weight: 600; background: var(--chipbg); border: var(--chipb); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); display: inline-block; }
  .dot.f { opacity: .3; }
  .amt { font-size: 22px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .lbl { font-size: 11px; color: var(--muted); }
  .go { background: var(--acc); color: var(--onacc); border-radius: 999px; padding: 11px; text-align: center; font-weight: 600; }
  .flip { position: absolute; left: 50%; bottom: -15px; transform: translateX(-50%); width: 26px; height: 26px; border-radius: 50%; border: var(--flipb); background: var(--chipbg); color: var(--ink); display: grid; place-items: center; font-size: 12px; z-index: 2; }
  .dest { border-radius: 999px; border: 2px dashed var(--dash); padding: 5px 12px; font-size: 11px; color: var(--muted); }
  .meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 9px 0; }
  .act { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 11px; border-top: var(--hair); }
  .act:first-of-type { border-top: 0; }
  .r { margin-left: auto; }
  .h { font-weight: 700; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .mk g { stroke: var(--acc); } .mk circle, .mk polygon { fill: var(--acc); }
  /* themes */
  .paper { --bg:#fff; --from:#f4f2ee; --to:#ece9e3; --ink:#1b1a19; --muted:#77736d; --acc:#eb6834; --onacc:#fff; --rule:3px solid #1b1a19; --chipb:2px solid #1b1a19; --chipbg:#fff; --flipb:3px solid #1b1a19; --dash:#c9c4bd; --hair:1px solid #e4e1dc; --track:#eb6834; --core:#ffe3d6; }
  .tonal { --bg:#faf9f6; --from:#f1eee9; --to:#e7e3dc; --ink:#1b1a19; --muted:#7a766f; --acc:#eb6834; --onacc:#fff; --rule:0; --chipb:0; --chipbg:#fff; --flipb:0; --dash:#cfcac2; --hair:1px solid #ebe7e1; --track:#eb6834; --core:#ffe3d6; }
  .night { --bg:#121110; --from:#1c1a18; --to:#252220; --ink:#f0ede8; --muted:#9a948b; --acc:#ff7a45; --onacc:#120d0a; --rule:0; --chipb:1.5px solid #3a3632; --chipbg:#1c1a18; --flipb:1.5px solid #3a3632; --dash:#4a453f; --hair:1px solid #2a2724; --track:#ff7a45; --core:#ffd6c2; }
  .ember { --bg:#fff7f2; --from:#eb6834; --to:#fde4d7; --ink:#1b1a19; --muted:#8a5a43; --acc:#1b1a19; --onacc:#fff; --rule:0; --chipb:0; --chipbg:#fff; --flipb:3px solid #fff7f2; --dash:#e7b8a0; --hair:1px solid #f6d8c8; --track:#eb6834; --core:#ffe3d6; }
  .ember .from, .ember .from .lbl, .ember .from .amt { color: #fff; }
  .ember .from .menu, .ember .from .chip { color: #1b1a19; }
  .ink { --bg:#0b0b0b; --from:#0b0b0b; --to:#0b0b0b; --ink:#f0efec; --muted:#8f8d87; --acc:#eb6834; --onacc:#fff; --rule:1px solid #2b2a28; --chipb:1.5px solid #f0efec; --chipbg:#0b0b0b; --flipb:1.5px solid #f0efec; --dash:#3a3936; --hair:1px solid #1f1e1c; --track:#eb6834; --core:#ffe3d6; }
</style>

<h2>Theme variations</h2>
<p class="subtitle">Same layout and shapes in five treatments. A keeps the 3-unit black rules; B to E drop them and separate the bands by tone or hairlines. Click the ones worth pursuing (you can pick several).</p>

<div class="th options" data-multiselect>
<template id="t"></template>
</div>

<script>
  const themes = [
    ["paper", "A", "Paper, black rules", "What you saw: off-white, 3-unit black rules between bands, outlined pills."],
    ["tonal", "B", "Paper, no rules", "Bands separated only by grey steps. Pills are solid white with no outline. Quietest."],
    ["night", "C", "Night", "Warm near-black, bands one step lighter each, a brighter orange. No rules."],
    ["ember", "D", "Ember", "The From band is the accent colour; To is a pale tint. The Bridge pill goes ink. Loudest."],
    ["ink", "E", "Ink", "Pure black, one flat surface, hairline rules only, white outlined pills. Most like the mark on black."],
  ];
  const mark = '<svg class="mk" viewBox="0 0 48 48" width="22" height="22"><g fill="none" stroke-width="3"><path d="M18.76 42.26 A19 19 0 0 1 24 5"/><path d="M40.2 14.07 A19 19 0 0 1 37.44 37.44"/><path d="M1 29 H42.33"/><path d="M24 11 V29"/><path d="M24 25.5 L27.39 21.41"/><path d="M24 25.5 L28 29"/><path d="M31 11 V29"/><path d="M31 21 H32 A4 4 0 0 1 32 29"/></g><polygon points="12.55,19.5 21.55,19.5 21.55,23.35 18.12,27.5 14.22,27.5 18.36,22.5 12.55,22.5"/><circle cx="36.83" cy="9.99" r="2.1"/><circle cx="24" cy="43" r="2.1"/></svg>';
  const pulse = (done) => done
    ? '<svg viewBox="0 0 120 12" width="86"><line x1="8" y1="6" x2="112" y2="6" stroke="var(--track)" stroke-width="3"/><circle cx="6" cy="6" r="4" fill="var(--acc)"/><circle cx="114" cy="6" r="4" fill="var(--acc)"/></svg>'
    : '<svg viewBox="0 0 120 12" width="86"><line x1="8" y1="6" x2="112" y2="6" stroke="var(--track)" stroke-width="3" opacity=".2"/><g fill="var(--track)"><circle cx="42.7" cy="6" r="1.4"/><circle cx="60" cy="6" r="1.4"/><circle cx="77.3" cy="6" r="1.4" opacity=".35"/></g><line x1="58" y1="6" x2="70" y2="6" stroke="var(--track)" stroke-width="4.4" stroke-linecap="round"/><line x1="58" y1="6" x2="70" y2="6" stroke="var(--core)" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="6" r="4" fill="var(--acc)"/><circle cx="114" cy="6" r="4" fill="var(--acc)" opacity=".3"/></svg>';
  const html = ([cls, letter, name, why]) => `
  <div class="option" data-choice="${cls}" onclick="toggleSelect(this)" style="display:block">
    <div class="letter">${letter}</div>
    <div class="content"><h3>${name}</h3><p>${why}</p></div>
    <div class="pg ${cls}">
      <div class="band"><div class="in top">${mark}<b>zkb.fi</b><span class="chip r">0x52…9EE7</span></div></div>
      <div class="band from"><div class="in"><span class="menu"><span class="dot"></span>From Ethereum ▾</span>
        <div class="row"><span class="amt">1.25</span><span class="chip r">ETH ▾</span></div><div class="lbl">Balance 3.40 · Max</div></div><div class="flip">⇅</div></div>
      <div class="band to"><div class="in" style="padding-top:18px"><span class="lbl" style="display:inline-flex;align-items:center;gap:6px"><span class="dot f"></span>To PulseChain</span>
        <div class="row"><span class="amt">1.2488</span><span class="lbl r">zkbWETH</span></div></div></div>
      <div class="band"><div class="in"><div class="dest">+ Send to another address</div><div class="meta"><span>About 15 min</span><span>Fee 0.0012 ETH</span></div><div class="go">Bridge</div></div></div>
      <div class="band" style="border-bottom:0"><div class="in"><div class="h">Your activity</div>
        <div class="act">${pulse(false)}<b>0.50 ETH</b><span class="r" style="color:var(--acc)">~6 min</span></div>
        <div class="act">${pulse(true)}<b>200 USDC</b><span class="r lbl">2 h ago</span></div></div></div>
    </div>
  </div>`;
  document.querySelector(".th").innerHTML = themes.map(html).join("");
</script>
