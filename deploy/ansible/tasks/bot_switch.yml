---
# One bot. Needs zkb_bot (publisher, runner or traffic), zkb_commit, zkb_release.
- name: Look for the files of the {{ zkb_bot }}
  ansible.builtin.stat:
    path: "{{ zkb_etc }}/{{ item }}"
  loop: "{{ zkb_bot_required_files[zkb_bot] }}"
  register: zkb_bot_files
  check_mode: false

- name: Say so when files are missing
  ansible.builtin.debug:
    msg: "Skip {{ zkb_bot }}: {{ zkb_bot_files.results | rejectattr('stat.exists') | map(attribute='item') | list }} missing under {{ zkb_etc }} (see deploy/app-server/config/)."
  when: zkb_bot_files.results | rejectattr('stat.exists') | list | length > 0

- name: Move the {{ zkb_bot }}
  when: zkb_bot_files.results | rejectattr('stat.exists') | list | length == 0
  block:
    - name: Restart only the on the release (it stops after its current step)
      ansible.builtin.command:
        argv:
          - bash
          - "{{ zkb_release }}/deploy/app-server/deploy.sh"
          - "{{ zkb_commit }}"
          - "{{ zkb_repo_dir }}"
      environment:
        ZKB_SERVICES: "{{ zkb_bot }}"
      changed_when: true

    - name: Check that deploy.sh made the release current
      ansible.builtin.stat:
        path: "{{ zkb_current }}"
      register: zkb_now_current
      when: not ansible_check_mode

    - name: Stop unless current is the release (a deploy.sh that fetched nothing must not pass as a switch)
      ansible.builtin.assert:
        that: zkb_now_current.stat.lnk_target | default('') == zkb_release
        fail_msg: "deploy.sh did not switch: current is {{ zkb_now_current.stat.lnk_target | default('none') }}"
      when: not ansible_check_mode

    - name: Wait 15 seconds
      ansible.builtin.wait_for:
        timeout: 15
      when: not ansible_check_mode

    - name: Look at the unit
      ansible.builtin.systemd_service:
        name: "zk-bridge-{{ zkb_bot }}.service"
      register: zkb_bot_unit
      check_mode: false

    - name: Check that the bot is running
      ansible.builtin.assert:
        that:
          - zkb_bot_unit.status.ActiveState == 'active'
        fail_msg: >-
          {{ zkb_bot }} is not running on {{ zkb_commit }}. Read: journalctl -u zk-bridge-{{ zkb_bot }} --no-pager | tail -n 50.
          Go back: ansible-playbook bots.yml -e commit=<previous-hash> -e bots={{ zkb_bot }}
        quiet: true
      when: not ansible_check_mode
