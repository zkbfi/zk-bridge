---
# Moves the publisher, the runner, the traffic bot and the status service to a release (the status service holds no wallet and
# has no nonce to collide, but it is moved the same way: stop, start, check). There is no green beside blue: the runner and the
# traffic bot each send transactions from one wallet (two would collide on nonces), and the publisher posts proofs. The new process starts after the
# old one stopped cleanly.
#   - A bot whose configuration files do not exist under /etc/zk-bridge is skipped with a message, as deploy.sh does.
#   - The publisher is not restarted while it is proving (its last journal event of 6 hours is proving_started: a paid
#     run on the remote prover). Wait for proof_made, then run this again.
#   - The runner and the traffic bot stop after their current step (the units allow 330 s); systemctl waits for that, so
#     the stop is the drain.
#   - One bot at a time; 15 seconds later the unit must be active.
#
#   cd deploy/ansible
#   ansible-playbook bots.yml -e commit=<hash>                          # publisher and runner
#   ansible-playbook bots.yml -e commit=<hash> -e bots=runner           # one or more: publisher, runner, traffic, comma separated
#   ansible-playbook bots.yml -e commit=<hash> -e bots=traffic          # the traffic bot (testnets; skipped without its files)
#   ansible-playbook bots.yml -e commit=<hash> -e bots=status           # the status service (status.zkb.fi; sends nothing, skipped without its files)
#   ansible-playbook bots.yml -e commit=<previous-hash> -e bots=runner  # rollback: the same step with the old release
- name: Move the bots to a release
  hosts: zkbfi
  gather_facts: false
  vars:
    bots: publisher,runner
  tasks:
    - name: Check the bots
      ansible.builtin.assert:
        that:
          - bots.split(',') | difference(['publisher', 'runner', 'traffic', 'status']) | length == 0
          - bots.split(',') | length > 0
        fail_msg: "bots is a comma separated list of publisher, runner, traffic and status."
        quiet: true

    - name: Find the release
      ansible.builtin.include_tasks: tasks/resolve_release.yml

    - name: Look at the publisher journal
      ansible.builtin.include_tasks: tasks/publisher_idle.yml
      when: "'publisher' in bots.split(',')"

    - name: Stop, because the publisher is proving
      ansible.builtin.fail:
        msg: "The publisher is proving (a paid run on the remote prover). Wait for proof_made, then run this again."
      when:
        - "'publisher' in bots.split(',')"
        - zkb_publisher_proving | default(false)

    - name: Move each bot
      ansible.builtin.include_tasks: tasks/bot_switch.yml
      loop: "{{ bots.split(',') }}"
      loop_control:
        loop_var: zkb_bot
