# Ansible settings for the zkb.fi deploy playbooks. Run ansible-playbook from this directory (deploy/ansible), so this
# file is found. See docs/deploy-blue-green.md.
[defaults]
inventory = inventory/hosts.yml
# The server is reached through the "zkbfi-app" alias of ~/.ssh/config (key from the 1Password SSH agent). Nothing about
# the connection is repeated here.
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
forks = 1
# A deploy step is slow on purpose (it waits for jobs and for a backfill). No task has a hidden shorter limit than the
# one in its own variables.
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=20
retries = 2
