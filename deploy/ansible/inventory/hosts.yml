---
# zkbfi-app is the alias in ~/.ssh/config (address, user root, key). Ansible only names it.
all:
  children:
    zkbfi:
      hosts:
        zkbfi-app:
          ansible_become: true
          ansible_become_user: root
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
