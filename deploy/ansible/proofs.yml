---
# Exports, imports and verifies the durable proof archive (deploy/app-server/proofs.sh on the server; its private
# mirror in /var/backups/zk-bridge/proofs/mirror, docs/proof-archive.md).
#
#   cd deploy/ansible
#   ansible-playbook proofs.yml -e action=export                       # update the mirror now, then pull it here
#   ansible-playbook proofs.yml -e action=export -e commit=<hash>      # ... with the scripts and the CLI of that release
#   ansible-playbook proofs.yml -e action=import                       # restore the archive from the server's own mirror
#   ansible-playbook proofs.yml -e action=import -e mirror=~/zkb-backups/proofs/mirror [-e trust_list=<local file>]
#   ansible-playbook proofs.yml -e action=import -e bundle=<local zk-bridge-proofs-<stamp>.tar.gz or zk-bridge-mirror-...>
#                                                 [-e trust_list=<local file> | -e manifest_sha256=<hex> [-e snapshot_sha256=<hex>]]
#   ansible-playbook proofs.yml -e action=verify                       # the server's mirror: manifest, then the chain
#   ansible-playbook proofs.yml -e action=verify -e bundle=<file name on the server>
#   ansible-playbook proofs.yml -e action=publish -e dry_run=true      # build the PUBLIC tree only; prints its path
#   ansible-playbook proofs.yml -e action=publish                      # add the public tree to IPFS; prints the CID
#   ansible-playbook proofs.yml -e action=publish -e publish_dns=true -e confirm_production=yes
#                                                                      # ... and point _dnslink.proofs at the new CID
#   ansible-playbook proofs.yml -e publish_dns=true -e cid=<cid> -e confirm_production=yes   # DNS only, for a CID made earlier
#
# export: runs the export on the server (the mirror gets the day's files and manifest), then pulls the mirror into
# zkb_proofs_local_dir/mirror (default ~/zkb-backups/proofs/mirror, the same copy the daily pull of the operator's Mac
# keeps) with deploy/operator/pull-proofs.sh: rsync, records only ever added, beacon states, snapshots and manifests
# following the server's 30 day window, then the newest manifest checked here. The server also runs the export every
# night (zk-bridge-proofs-export.timer). No tarball is made; `proofs.sh bundle` on the server makes one by hand.
# import: without bundle or mirror, from the server's own mirror (after a lost database). With -e mirror=<local dir>, the
# mirror is copied up into <backup dir>/incoming-mirror (root's, never the server's mirror, which the archive user can
# write) and imported from there. The newest manifest must be root's own copy on this server (and in its
# manifests.sha256), the snapshot and the beacon states must have hashes root recorded. For a mirror from another
# server, -e trust_list=<local file> (that server's manifests.sha256, which the daily pull keeps in
# ~/zkb-backups/proofs/manifests.sha256) is copied up and used instead; or -e manifest_sha256=<hex>
# [-e snapshot_sha256=<hex>] by hand (beacon states are then left out). With
# -e bundle=<local tar.gz>, the bundle (and its .sha256, when it sits next to it) is copied into the backup directory and
# imported: a mirror bundle, or a nightly bundle of the old format. Nothing that differs is overwritten. Exit 3 of the
# import (conflicts) FAILS the play, after the summary is shown: the data that did not conflict is already in, and the
# conflicts need a person to look at them.
# publish: proofs.sh publish on the server (see its header). The tree is public data from an allowlist, checked by the
# archive CLI's sanitizer before anything is added. Review a dry run first. The DNSLink record is written only with
# -e publish_dns=true (and confirm_production=yes), by the same tasks that sites.yml uses for docs.zkb.fi, which first
# check that a public gateway serves the CID; the old record content is printed first and is the rollback.
# verify: the server's mirror against its newest manifest, then every storage proof against the chain (needs the RPC
# settings of the indexer on the server).
- name: Export, import or verify the proof archive
  hosts: zkbfi
  gather_facts: false
  vars:
    zkb_proofs_action: "{{ action | default('dns' if (publish_dns | default(false) | bool) else '') }}"
  tasks:
    - name: Check the action
      ansible.builtin.assert:
        that:
          - zkb_proofs_action in ['export', 'import', 'verify', 'publish', 'dns']
        fail_msg: "Say what to do: -e action=export, -e action=import [-e mirror=<local mirror> | -e bundle=<local tar.gz>], -e action=verify, or -e action=publish."
        quiet: true

    - name: Check what import was given
      when: zkb_proofs_action == 'import'
      block:
        - name: Take a bundle or a mirror, not both
          ansible.builtin.assert:
            that:
              - not (bundle is defined and mirror is defined)
            fail_msg: "import takes -e bundle=<local tar.gz> or -e mirror=<local mirror directory> (or neither: the server's own mirror)."
            quiet: true

        - name: Look for the bundle or the mirror here
          ansible.builtin.stat:
            path: "{{ (bundle | default(mirror)) | expanduser }}"
          delegate_to: localhost
          become: false
          register: zkb_proofs_local_input
          check_mode: false
          when: bundle is defined or mirror is defined

        - name: Check that it is there
          ansible.builtin.assert:
            that:
              - zkb_proofs_local_input.stat.exists
              - (zkb_proofs_local_input.stat.isreg if bundle is defined else zkb_proofs_local_input.stat.isdir)
              - mirror is not defined or (mirror | expanduser ~ '/manifests') is directory
            fail_msg: "{{ bundle | default(mirror) }} is not a {{ 'file' if bundle is defined else 'mirror directory (with manifests/)' }} on this machine."
            quiet: true
          when: bundle is defined or mirror is defined

    - name: Find the release when one is named
      ansible.builtin.include_tasks: tasks/resolve_release.yml
      when: commit is defined or zkb_built_commit is defined

    - name: Name the script and the release it uses
      ansible.builtin.set_fact:
        zkb_proofs_release: "{{ zkb_release | default(zkb_current) }}"

    # ---- export --------------------------------------------------------------------------------------------------
    - name: Export
      when: zkb_proofs_action == 'export'
      block:
        - name: Run the export on the server
          ansible.builtin.command:
            argv:
              - bash
              - "{{ zkb_proofs_release }}/deploy/app-server/proofs.sh"
              - export
          environment:
            ZKB_RELEASE_DIR: "{{ zkb_proofs_release }}"
          register: zkb_proofs_run
          changed_when: true

        - name: Show the summaries
          ansible.builtin.debug:
            msg: "{{ zkb_proofs_run.stdout_lines }}"

        - name: Take the mirror path from the output
          ansible.builtin.set_fact:
            zkb_proofs_remote_mirror: "{{ (zkb_proofs_run.stdout_lines | select('match', '^mirror: ') | list | last) | regex_replace('^mirror: ', '') }}"

        - name: Make the local directory
          ansible.builtin.file:
            path: "{{ zkb_proofs_local_dir | expanduser }}"
            state: directory
            mode: "0700"
          delegate_to: localhost
          become: false

        # The same script as the daily pull of the operator's Mac (deploy/operator/pull-proofs.sh): rsync over the ssh
        # alias, then the newest manifest is checked here. Its log lines are on standard error.
        - name: Pull the mirror here
          ansible.builtin.command:
            argv:
              - bash
              - "{{ playbook_dir }}/../operator/pull-proofs.sh"
          environment:
            ZKB_PULL_HOST: "{{ inventory_hostname }}"
            ZKB_PULL_REMOTE_DIR: "{{ zkb_proofs_remote_mirror }}"
            ZKB_PULL_REMOTE_LOCK: "{{ zkb_proofs_dir }}/.lock"
            ZKB_PULL_LOCAL_DIR: "{{ zkb_proofs_local_dir | expanduser }}"
          delegate_to: localhost
          become: false
          register: zkb_proofs_pull
          changed_when: true

        - name: Say where it is
          ansible.builtin.debug:
            msg: "{{ zkb_proofs_pull.stderr_lines + ['Mirror saved to ' ~ (zkb_proofs_local_dir | expanduser) ~ '/mirror (checked against its newest manifest).'] }}"

    # ---- import --------------------------------------------------------------------------------------------------
    - name: Import
      when: zkb_proofs_action == 'import'
      vars:
        zkb_proofs_remote_bundle: "{{ zkb_proofs_dir }}/{{ (bundle | default('')) | basename }}"
      block:
        - name: Copy the mirror up into a directory only root can write (never into the server's mirror)
          ansible.builtin.command:
            argv:
              - rsync
              - -rt
              - --delete
              - -e
              - ssh -o BatchMode=yes
              - "{{ mirror | expanduser }}/"
              - "{{ inventory_hostname }}:{{ zkb_proofs_dir }}/incoming-mirror/"
          delegate_to: localhost
          become: false
          changed_when: true
          when: mirror is defined

        - name: Look for the .sha256 next to the bundle
          ansible.builtin.stat:
            path: "{{ bundle | expanduser }}.sha256"
          delegate_to: localhost
          become: false
          register: zkb_proofs_local_sum
          check_mode: false
          when: bundle is defined

        - name: Copy the bundle to the server
          ansible.builtin.copy:
            src: "{{ bundle | expanduser }}"
            dest: "{{ zkb_proofs_remote_bundle }}"
            owner: root
            group: root
            mode: "0640"
          when: bundle is defined

        - name: Copy its .sha256 when there is one
          ansible.builtin.copy:
            src: "{{ bundle | expanduser }}.sha256"
            dest: "{{ zkb_proofs_remote_bundle }}.sha256"
            owner: root
            group: root
            mode: "0640"
          when: bundle is defined and zkb_proofs_local_sum.stat.exists

        - name: Copy the trust list of the other server up (root's, 0600)
          ansible.builtin.copy:
            src: "{{ trust_list | expanduser }}"
            dest: "{{ zkb_proofs_dir }}/incoming-trust.sha256"
            owner: root
            group: root
            mode: "0600"
          when: trust_list is defined

        - name: Run the import
          ansible.builtin.command:
            argv: >-
              {{ ['bash', zkb_proofs_release ~ '/deploy/app-server/proofs.sh', 'import']
                 + ([zkb_proofs_remote_bundle] if bundle is defined else [])
                 + ([zkb_proofs_dir ~ '/incoming-mirror'] if mirror is defined else [])
                 + (['--trust-list', zkb_proofs_dir ~ '/incoming-trust.sha256'] if trust_list is defined else [])
                 + (['--manifest-sha256', manifest_sha256] if manifest_sha256 is defined else [])
                 + (['--snapshot-sha256', snapshot_sha256] if snapshot_sha256 is defined else []) }}
          environment:
            ZKB_RELEASE_DIR: "{{ zkb_proofs_release }}"
          register: zkb_proofs_run
          changed_when: true
          failed_when: zkb_proofs_run.rc not in [0, 3]

        - name: Show the summaries
          ansible.builtin.debug:
            msg: "{{ zkb_proofs_run.stdout_lines + zkb_proofs_run.stderr_lines }}"

        - name: Fail when the import found conflicts
          ansible.builtin.fail:
            msg: >-
              Imported with conflicts. Everything that did not conflict is in; nothing that differed was overwritten.
              Conflicting files: {{ zkb_proofs_run.stdout_lines | select('match', '^conflict: ') | list }}.
              Conflicting archive entries are recorded in the proof_archive conflicts table (see the lines above).
          when: zkb_proofs_run.rc == 3

    # ---- verify --------------------------------------------------------------------------------------------------
    - name: Verify
      when: zkb_proofs_action == 'verify'
      block:
        - name: Check the mirror against its newest manifest, then the storage proofs against the chain
          ansible.builtin.command:
            argv: "{{ ['bash', zkb_proofs_release ~ '/deploy/app-server/proofs.sh', 'verify'] + ([zkb_proofs_dir ~ '/' ~ (bundle | basename)] if bundle is defined else []) }}"
          environment:
            ZKB_RELEASE_DIR: "{{ zkb_proofs_release }}"
          register: zkb_proofs_run
          changed_when: false

        - name: Show the summaries
          ansible.builtin.debug:
            msg: "{{ zkb_proofs_run.stdout_lines + zkb_proofs_run.stderr_lines }}"

    # ---- publish -------------------------------------------------------------------------------------------------
    - name: Publish
      when: zkb_proofs_action == 'publish'
      block:
        - name: Build the public tree, and add it to IPFS unless this is a dry run
          ansible.builtin.command:
            argv: "{{ ['bash', zkb_proofs_release ~ '/deploy/app-server/proofs.sh', 'publish'] + (['--dry-run'] if (dry_run | default(false) | bool) else []) }}"
          environment:
            ZKB_RELEASE_DIR: "{{ zkb_proofs_release }}"
          register: zkb_proofs_run
          changed_when: not (dry_run | default(false) | bool)

        - name: Show the summaries
          ansible.builtin.debug:
            msg: "{{ zkb_proofs_run.stdout_lines + zkb_proofs_run.stderr_lines }}"

        - name: Remember the CID for the DNS step
          ansible.builtin.set_fact:
            zkb_proofs_cid: "{{ (zkb_proofs_run.stdout_lines | select('match', '^cid: ') | list | last | regex_replace('^cid: ', '')) }}"
          when: "zkb_proofs_run.stdout_lines | select('match', '^cid: ') | list | length > 0"

# The DNSLink record of the public proofs. Never runs unless -e publish_dns=true. It runs on this machine (like
# sites.yml): the Cloudflare token is read with `op read`, and the tasks are no_log.
- name: Point the DNSLink record of the public proofs at the CID
  hosts: control
  gather_facts: false
  tasks:
    - name: Do nothing unless asked
      ansible.builtin.meta: end_play
      when: not (publish_dns | default(false) | bool)

    - name: Take the CID from the publish step or from -e cid=
      ansible.builtin.set_fact:
        zkb_proofs_dns_cid: "{{ cid | default(hostvars[groups['zkbfi'][0]].zkb_proofs_cid | default('')) }}"

    - name: Check the request
      ansible.builtin.assert:
        that:
          - zkb_proofs_dns_cid | length > 0
          - confirm_production | default('') == 'yes'
          - not (dry_run | default(false) | bool)
        fail_msg: "publish_dns needs a real publication (or -e cid=<cid>), -e confirm_production=yes, and no dry_run."
        quiet: true

    - name: Write the record (the old content is printed first)
      ansible.builtin.include_tasks: tasks/site_docs.yml
      vars:
        docs_cid: "{{ zkb_proofs_dns_cid }}"
        zkb_dnslink_name: "{{ zkb_proofs_dnslink_name }}"
