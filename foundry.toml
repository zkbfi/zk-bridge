[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./script/hardened" },
  { access = "read", path = "./.deploy" },
  { access = "read", path = "./light-client/tests/fixtures" },
  { access = "read", path = "./test/hardened/fixtures" },
]
