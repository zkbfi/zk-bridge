[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./script/hardened" },
  { access = "read", path = "./.deploy" },
  { access = "read", path = "./light-client/tests/fixtures" },
  { access = "read", path = "./test/hardened/fixtures" },
  # script/testnet/DeployTestTokens.s.sol writes the test token file of the testnet next to its deployment file.
  { access = "read-write", path = "./deploy/deployments" },
]

# Long fuzz and invariant runs. Select with `FOUNDRY_PROFILE=deep forge test`. The default profile above is unchanged.
# Inline `forge-config: default.*` comments in tests do not apply here, so the limits below are the only ones.
[profile.deep]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read", path = "./script/hardened" },
  { access = "read", path = "./light-client/tests/fixtures" },
  { access = "read", path = "./test/hardened/fixtures" },
]

[profile.deep.fuzz]
runs = 50000

[profile.deep.invariant]
runs = 2000
depth = 100
fail_on_revert = true
